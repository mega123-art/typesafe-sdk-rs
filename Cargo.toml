[package]
name = "typesafe"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the TypeSafe API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/typesafe-ai/typesafe-sdk-rs"
homepage = "https://docs.typesafe.ai/sdk/rust"
keywords = ["typesafe", "ai", "api", "sdk"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
